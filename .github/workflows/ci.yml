name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.16"
  NODE_VERSION: "22.14.0"

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format check
        run: uv run --frozen ruff format --check .
      - name: Mypy
        run: uv run --frozen mypy app tests evaluation scripts
      - name: Pytest
        run: uv run --frozen pytest

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build

  security:
    name: Security Checks
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen
      - name: Audit Python dependencies
        run: uv run --frozen pip-audit
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Detect committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.27.2
          detect --source=/repo --redact --no-banner --log-opts="--all"
      - name: Scan repository vulnerabilities and misconfiguration
        run: >-
          docker run --rm -v "$PWD:/workspace" -v trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.70.0
          fs --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          --scanners vuln,misconfig,secret --skip-version-check /workspace
      - name: Validate GitHub Actions workflow
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.7 -color

  evaluation:
    name: Deterministic Evaluation
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHECKPOINT_BACKEND: memory
      RAG_BACKEND: local
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen
      - name: Full deterministic evaluation
        run: uv run --frozen python -m evaluation.runner
      - name: Safety evaluation
        run: uv run --frozen python -m evaluation.runner --safety
      - name: Resilience evaluation
        run: uv run --frozen python -m evaluation.runner --resilience

  docker-validation:
    name: Docker Build and Scan
    needs: evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Validate integration Compose model
        run: >-
          LOCAL_DEMO_AUTH_TOKEN=integration-ci-credential
          LOCAL_DEMO_ACTOR_ID=e2e-support-operator
          docker compose -f docker-compose.yml -f docker-compose.integration.yml
          --env-file .env.example config --quiet
      - name: Validate production Compose model excludes integration provider
        env:
          POSTGRES_PASSWORD: validation-only
          DATABASE_URL: postgresql+psycopg://app:validation-only@db:5432/customer_service
          PRODUCTION_AUTH_TOKENS_JSON: >-
            {"validation-only-token":{"actor_id":"operator-validation","actor_type":"support_operator","roles":["support_operator"]}}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /tmp/production-compose.yml
          if grep -q deterministic_integration /tmp/production-compose.yml; then
            echo "Integration-only LLM provider leaked into production Compose configuration."
            exit 1
          fi
      - name: Build backend image
        run: docker build --tag customer-service-backend:ci .
      - name: Build frontend image
        run: docker build --tag customer-service-frontend:ci frontend
      - name: Scan backend image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.70.0
          image --exit-code 1 --ignore-unfixed --severity CRITICAL
          --skip-version-check customer-service-backend:ci
      - name: Scan frontend image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.70.0
          image --exit-code 1 --ignore-unfixed --severity CRITICAL
          --skip-version-check customer-service-frontend:ci

  integration-smoke:
    name: Authenticated Full-Stack Lifecycle Smoke
    needs: docker-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_COMPOSE_PROJECT_NAME: customer-service-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_DEMO_AUTH_TOKEN: integration-ci-credential
      LOCAL_DEMO_AUTH_TOKEN: integration-ci-credential
      LOCAL_DEMO_ACTOR_ID: e2e-support-operator
      BACKEND_PORT: "0"
      FRONTEND_PORT: "0"
      POSTGRES_PORT: "0"
      QDRANT_HTTP_PORT: "0"
      QDRANT_GRPC_PORT: "0"
      JAEGER_UI_PORT: "0"
      OTEL_GRPC_PORT: "0"
      OTEL_HTTP_PORT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run authenticated agent lifecycle smoke
        run: python3 scripts/e2e_authenticated_smoke.py --leave-on-failure
      - name: Collect bounded redacted container logs
        if: failure()
        run: |
          docker compose --project-name "$E2E_COMPOSE_PROJECT_NAME" \
            --file docker-compose.yml --file docker-compose.integration.yml \
            --env-file .env.example ps --all
          docker compose --project-name "$E2E_COMPOSE_PROJECT_NAME" \
            --file docker-compose.yml --file docker-compose.integration.yml \
            --env-file .env.example logs --no-color --tail 200 \
            | sed "s/${LOCAL_DEMO_AUTH_TOKEN}/[REDACTED]/g"
      - name: Remove isolated integration stack and volumes
        if: always()
        run: >-
          docker compose --project-name "$E2E_COMPOSE_PROJECT_NAME"
          --file docker-compose.yml --file docker-compose.integration.yml
          --env-file .env.example down --volumes --remove-orphans --timeout 20
