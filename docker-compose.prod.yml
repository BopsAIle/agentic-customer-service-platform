services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_service}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-1.0}
          memory: ${POSTGRES_MEMORY_LIMIT:-1G}

  demo-setup:
    environment:
      APP_ENV: production
      AUTH_MODE: static
      AUTH_TOKENS_JSON: ${PRODUCTION_AUTH_TOKENS_JSON:?PRODUCTION_AUTH_TOKENS_JSON must be set}
      LOCAL_DEMO_AUTH_TOKEN: ""
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    command: ["alembic", "upgrade", "head"]

  backend:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: production
      AUTH_MODE: static
      AUTH_TOKENS_JSON: ${PRODUCTION_AUTH_TOKENS_JSON:?PRODUCTION_AUTH_TOKENS_JSON must be set}
      LOCAL_DEMO_AUTH_TOKEN: ""
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPU_LIMIT:-1.0}
          memory: ${BACKEND_MEMORY_LIMIT:-1G}

  frontend:
    build:
      args:
        LOCAL_DEMO_AUTH_TOKEN: ""
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: ${FRONTEND_CPU_LIMIT:-0.5}
          memory: ${FRONTEND_MEMORY_LIMIT:-256M}

  qdrant:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${QDRANT_CPU_LIMIT:-1.0}
          memory: ${QDRANT_MEMORY_LIMIT:-1G}

  jaeger:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${JAEGER_CPU_LIMIT:-0.5}
          memory: ${JAEGER_MEMORY_LIMIT:-512M}
