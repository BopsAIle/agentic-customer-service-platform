# Explicitly integration-only override for the hermetic authenticated lifecycle smoke.
# Never layer this file into a production deployment.
services:
  demo-setup:
    environment:
      APP_ENV: integration
      LANGGRAPH_STRICT_MSGPACK: "true"
      LLM_PROVIDER: deterministic_integration
      AGENT_DECISION_CONTRACT_VERSION: semantic_decision_v3
      POLICY_AUDIT_BACKEND: postgres
      AGENT_RUN_PROJECTION_BACKEND: postgres

  backend:
    environment:
      APP_ENV: integration
      LANGGRAPH_STRICT_MSGPACK: "true"
      LLM_PROVIDER: deterministic_integration
      AGENT_DECISION_CONTRACT_VERSION: semantic_decision_v3
      POLICY_AUDIT_BACKEND: postgres
      AGENT_RUN_PROJECTION_BACKEND: postgres

  frontend:
    build:
      args:
        FRONTEND_AUTH_MODE: integration
